<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Junelle Suaybaguio</title>
    <meta name="robots" content="noindex" />
    <script>
      // Old multi-page URLs (/final/about, /final/project, /final/resume) map to the
      // sections of the new single page. Works for /final/preview/ too.
      (function () {
        var m = location.pathname.match(/^(\/final(?:\/preview)?)\/(about|project|projects|resume)\/?$/);
        if (m) {
          var map = { about: "about", project: "work", projects: "work", resume: "resume" };
          location.replace(m[1] + "/#" + map[m[2]]);
        }
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <style>
      :root { color-scheme: dark; --bg: #0b0a12; --text: #ecebf2; --muted: #a9a6b8; --accent: #c770f0; --ink: #0b0a12; --focus: #f0c1ff; }
      :root[data-theme="light"] { color-scheme: light; --bg: #faf9fc; --text: #16131f; --muted: #55506a; --accent: #7b2cbf; --ink: #fff; --focus: #5b1a99; }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) { color-scheme: light; --bg: #faf9fc; --text: #16131f; --muted: #55506a; --accent: #7b2cbf; --ink: #fff; --focus: #5b1a99; }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh; display: grid; place-items: center; padding: 1.5rem;
        background: var(--bg); color: var(--text);
        font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { display: grid; gap: 1.25rem; max-width: 34rem; text-align: center; justify-items: center; }
      .code { font: 0.9rem ui-monospace, Consolas, monospace; color: var(--muted); letter-spacing: 0.08em; }
      h1 { font-size: clamp(2.2rem, 1.5rem + 3vw, 3.5rem); line-height: 1.05; letter-spacing: -0.03em; }
      h1 em { font-family: Georgia, serif; font-weight: 400; color: var(--accent); }
      p { color: var(--muted); }
      a {
        display: inline-flex; align-items: center; min-height: 48px; padding: 0 1.5rem; border-radius: 999px;
        background: var(--accent); color: var(--ink); font-weight: 600; text-decoration: none;
      }
      a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page <em>doesn't exist</em>.</h1>
      <p>The link may be old or mistyped. Everything on this site now lives on a single page.</p>
      <a href="/final/">Go to the home page</a>
    </main>
  </body>
</html>
