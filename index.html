    <!-- Theme: applied before first paint so there is never a flash. Also flags JS + scroll-driven support. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        if (location.hash) d.classList.add("cv-settled");
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") d.dataset.theme = t;
          if (localStorage.getItem("motion") === "paused") d.classList.add("motion-paused");
        } catch (e) {}
        try {
          if (CSS.supports("animation-timeline: view()")) d.classList.add("sd-reveal");
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0a12" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9fc" />
